<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفكرة الأداء الأسبوعي</title>
    <!-- أيقونة التبويب في المتصفح (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'><path d='M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z'/></svg>">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --input-text: #000000;
            --output-bg: #e9ecef;
            --output-text: #212529;
            --output-border: #ced4da;
            --icon-fill: #007bff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #f4f7f6;
            --label-color: #b0b0b0;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --input-text: #ffffff;
            --output-bg: #2a2a2a;
            --output-text: #f4f7f6;
            --output-border: #444;
            --icon-fill: #4dabf7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            position: relative;
            transition: background-color 0.3s;
        }
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            margin: 0;
            background-color: transparent !important;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .theme-toggle:hover {
            background-color: rgba(0,0,0,0.05) !important;
        }
        [data-theme="dark"] .theme-toggle:hover {
            background-color: rgba(255,255,255,0.1) !important;
        }
        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: var(--icon-fill);
            transition: transform 0.4s ease;
        }
        .theme-toggle:active svg {
            transform: rotate(180deg);
        }

        /* إظهار وإخفاء الشمس والقمر بناءً على الثيم */
        .sun-icon { display: none; }
        .moon-icon { display: block; }

        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--label-color);
        }
        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: var(--input-bg);
            color: var(--input-text);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-copy {
            background-color: #28a745;
        }
        .btn-copy:hover {
            background-color: #218838;
        }
        .btn-reset {
            background-color: #dc3545;
        }
        .btn-reset:hover {
            background-color: #c82333;
        }
        .output-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--output-bg);
            border-radius: 8px;
            white-space: pre-line;
            font-size: 15px;
            line-height: 1.6;
            color: var(--output-text);
            border: 1px solid var(--output-border);
        }
        .icon {
            width: 20px;
            height: 20px;
            fill: var(--icon-fill);
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- زر تبديل الوضع الداكن/الفاتح بأيقونة متجهة تفاعلية -->
    <button class="theme-toggle" onclick="toggleTheme()" title="تغيير الوضع">
        <svg viewBox="0 0 24 24">
            <!-- أيقونة الشمس (تظهر في الوضع الداكن) -->
            <path class="sun-icon" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36l1.06-1.06c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0z"/>
            <!-- أيقونة القمر (تظهر في الوضع الفاتح) -->
            <path class="moon-icon" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>

    <h2>
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>
        تسجيل الأداء الأسبوعي
    </h2>

    <!-- بيانات يوم الاثنين -->
    <div class="form-group">
        <label>
            <svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            تاريخ يوم الاثنين:
        </label>
        <input type="date" id="mondayDate">
    </div>
    <div class="form-group">
        <label>
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            المدفوع يوم الاثنين (من 0 إلى 2):
        </label>
        <select id="mondayVal">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
        </select>
    </div>
    <button onclick="saveMonday()">حفظ بيانات يوم الاثنين 💾</button>

    <hr style="margin: 20px 0; border-color: var(--input-border);">

    <!-- بيانات يوم الخميس -->
    <div class="form-group">
        <label>
            <svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            تاريخ يوم الخميس:
        </label>
        <input type="date" id="thursdayDate">
    </div>
    <div class="form-group">
        <label>
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            المدفوع يوم الخميس (من 0 إلى 3):
        </label>
        <select id="thursdayVal">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
    </div>

    <button onclick="generateMessage()">حفظ الخميس وإنشاء الرسالة النهائية 🚀</button>

    <!-- منطقة عرض الرسالة والنسخ -->
    <div id="resultArea" style="display: none;">
        <div class="output-box" id="messageOutput"></div>
        <button class="btn-copy" onclick="copyMessage()">نسخ النص 📋</button>
    </div>

    <button class="btn-reset" onclick="resetData()" style="margin-top: 20px;">مسح البيانات لبدء أسبوع جديد 🔄</button>
</div>

<script>
    // تحميل البيانات والثيم المحفوظ مسبقاً
    window.onload = function() {
        if(localStorage.getItem('monDate')) document.getElementById('mondayDate').value = localStorage.getItem('monDate');
        if(localStorage.getItem('monVal')) document.getElementById('mondayVal').value = localStorage.getItem('monVal');
        
        if(localStorage.getItem('thuDate')) document.getElementById('thursdayDate').value = localStorage.getItem('thuDate');
        if(localStorage.getItem('thuVal')) document.getElementById('thursdayVal').value = localStorage.getItem('thuVal');

        // استرجاع وضع الثيم
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    };

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    function saveMonday() {
        const monDate = document.getElementById('mondayDate').value;
        const monVal = document.getElementById('mondayVal').value;
        if(!monDate) {
            alert('يرجى تحديد تاريخ يوم الاثنين');
            return;
        }
        localStorage.setItem('monDate', monDate);
        localStorage.setItem('monVal', monVal);
        alert('تم حفظ بيانات يوم الاثنين بنجاح!');
    }

    function generateMessage() {
        const monDate = localStorage.getItem('monDate') || document.getElementById('mondayDate').value;
        const monVal = parseInt(localStorage.getItem('monVal') || document.getElementById('mondayVal').value);
        
        const thuDate = document.getElementById('thursdayDate').value;
        const thuVal = parseInt(document.getElementById('thursdayVal').value);

        if (!monDate || !thuDate) {
            alert('يرجى التأكد من إدخال بيانات يوم الاثنين والخميس.');
            return;
        }

        const monResult = 2 - monVal;
        const thuResult = 3 - thuVal;
        const sumVal = monVal + thuVal;
        const totalResult = 5 - sumVal;

        const messageText = 
`يوم الاثنين (${monDate}):
النتيجة: ${monResult}

يوم الخميس (${thuDate}):
النتيجة: ${thuResult}

------------------------------
المجموع الكلي: ${totalResult}`;

        document.getElementById('messageOutput').innerText = messageText;
        document.getElementById('resultArea').style.display = 'block';
    }

    function copyMessage() {
        const textToCopy = document.getElementById('messageOutput').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('تم نسخ الرسالة بنجاح!');
        });
    }

    function resetData() {
        if(confirm('هل أنت متأكد من مسح البيانات لبدء أسبوع جديد؟')) {
            localStorage.clear();
            location.reload();
        }
    }
</script>

</body>
</html>
